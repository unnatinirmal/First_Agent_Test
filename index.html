<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tetris</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell" aria-label="Tetris game">
      <section class="game-area" aria-label="Game board">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="overlay" class="overlay hidden" aria-live="polite">
          <h1 id="overlayTitle">Paused</h1>
          <p id="overlayText">Press P to resume</p>
        </div>
      </section>

      <aside class="panel" aria-label="Game information and controls">
        <div class="brand">
          <h1>Tetris</h1>
          <p>Clear lines, climb levels, keep the stack breathing.</p>
        </div>

        <div class="stats">
          <div>
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>Lines</span>
            <strong id="lines">0</strong>
          </div>
          <div>
            <span>Level</span>
            <strong id="level">1</strong>
          </div>
        </div>

        <div class="preview-wrap">
          <span>Next</span>
          <canvas id="next" width="120" height="120"></canvas>
        </div>

        <div class="buttons">
          <button id="startButton" type="button">Start</button>
          <button id="pauseButton" type="button">Pause</button>
        </div>

        <dl class="controls">
          <div><dt>Move</dt><dd>Left / Right</dd></div>
          <div><dt>Rotate</dt><dd>Up or X</dd></div>
          <div><dt>Soft drop</dt><dd>Down</dd></div>
          <div><dt>Hard drop</dt><dd>Space</dd></div>
          <div><dt>Pause</dt><dd>P</dd></div>
        </dl>
      </aside>
    </main>

    <script src="game.js"></script>
  </body>
</html>
